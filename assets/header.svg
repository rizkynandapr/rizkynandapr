<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d">
  <title id="t">Rizky Nanda Praditia</title>
  <desc id="d">A call waveform flows into an intake record. Emergency caught, address and callback number captured, one record written.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1420"/>
      <stop offset="1" stop-color="#141C2B"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2B84B" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#F2B84B" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#F2B84B"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1E2838" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="320" rx="18"/></clipPath>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
      .scan{animation:scan 6s linear infinite}
      .blink{animation:blink 1.2s steps(1) infinite}
      .pulse{animation:pulse 2.4s ease-in-out infinite;transform-origin:668px 176px}
      @keyframes scan{0%{transform:translateX(0)}100%{transform:translateX(238px)}}
      @keyframes blink{50%{opacity:0}}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
      @media (prefers-reduced-motion:reduce){.scan,.blink,.pulse{animation:none}}
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)" opacity="0.55"/>

    <!-- left: name -->
    <text x="56" y="92" class="mono" font-size="14" letter-spacing="3" fill="#8A97A8">CH 01 · INTAKE LINE · UTC+7</text>
    <text x="54" y="150" class="sans" font-size="46" font-weight="700" fill="#EEF2F7">Rizky Nanda</text>
    <text x="54" y="200" class="sans" font-size="46" font-weight="700" fill="#EEF2F7">Praditia</text>
    <text x="56" y="244" class="mono" font-size="17" fill="#F2B84B">AI automation engineer</text>
    <text x="56" y="272" class="mono" font-size="14" fill="#8A97A8">intake agents · evals · n8n · WhatsApp bots</text>

    <!-- middle: call waveform -->
    <g transform="translate(430 0)">
      <line x1="0" y1="176" x2="238" y2="176" stroke="#26324A" stroke-width="1"/>
      <path d="M0 176 L18 176 L24 168 L30 184 L36 172 L42 180 L48 176 L64 176 L70 150 L76 202 L82 140 L88 210 L94 160 L100 190 L106 176 L122 176 L128 162 L134 190 L140 170 L146 182 L152 176 L170 176 L176 128 L182 224 L188 118 L194 232 L200 150 L206 200 L212 176 L238 176"
            fill="none" stroke="url(#wave)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
      <text x="210" y="104" text-anchor="end" class="mono" font-size="12" fill="#FF5C47">"smells like eggs"</text>
      <line x1="185" y1="110" x2="185" y2="124" stroke="#FF5C47" stroke-width="1.5"/>
      <circle cx="238" cy="176" r="5" fill="#F2B84B" class="pulse"/>
    </g>

    <!-- right: record card -->
    <g transform="translate(700 58)">
      <rect width="446" height="206" rx="12" fill="#0A0F18" stroke="#26324A"/>
      <rect width="446" height="30" rx="12" fill="#141C2B"/>
      <rect y="18" width="446" height="12" fill="#141C2B"/>
      <circle cx="20" cy="15" r="4.5" fill="#FF5C47"/>
      <circle cx="36" cy="15" r="4.5" fill="#F2B84B"/>
      <circle cx="52" cy="15" r="4.5" fill="#3D4A60"/>
      <text x="72" y="20" class="mono" font-size="12" fill="#8A97A8">intake_record.json</text>

      <g class="mono" font-size="15">
        <text x="22" y="62"><tspan fill="#8A97A8">"urgency":</tspan><tspan fill="#FF5C47"> "emergency"</tspan></text>
        <text x="22" y="90"><tspan fill="#8A97A8">"emergency_type":</tspan><tspan fill="#EEF2F7"> "gas"</tspan></text>
        <text x="22" y="118"><tspan fill="#8A97A8">"service_address":</tspan><tspan fill="#EEF2F7"> "1420 Oak St"</tspan></text>
        <text x="22" y="146"><tspan fill="#8A97A8">"callback_number":</tspan><tspan fill="#EEF2F7"> "•••-•••-0182"</tspan></text>
        <text x="22" y="174"><tspan fill="#8A97A8">"outcome":</tspan><tspan fill="#EEF2F7"> "escalated"</tspan></text>
      </g>
      <g class="mono" font-size="13" fill="#F2B84B">
        <text x="392" y="118">ok</text>
        <text x="392" y="146">ok</text>
      </g>
      <text x="22" y="198" class="mono" font-size="12" fill="#5B6B82">records: 1 · caller still on line: no<tspan class="blink" fill="#F2B84B"> ▌</tspan></text>
    </g>

    <!-- scan line over waveform -->
    <rect x="430" y="96" width="2" height="160" fill="#F2B84B" opacity="0.18" class="scan"/>
  </g>
</svg>
